name: dogada_gezi
description: Doğa keşifleri için sade Flutter mobil uygulaması.
publish_to: none
version: 1.0.1+2

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.1
  flutter_svg: ^2.2.3
  geolocator: ^14.0.3
  http: ^1.2.2
  image_picker: ^1.1.2
  latlong2: ^0.10.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.17.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/dogadayim_logo_full.png
    - assets/branding/dogadayim_logo_mark.png
    - assets/images/auth_misty_forest.jpg
    - assets/photos/ekotaban_optimized/012f751248c32853523e.jpg
    - assets/photos/ekotaban_optimized/6163f613af33596c7c1a.jpg
    - assets/photos/ekotaban_optimized/bd65c7c5d50856793c17.jpg
    - assets/photos/ekotaban_optimized/7aa43047063126595c33.jpg
    - assets/photos/ekotaban_optimized/530c804189b8a718fda7.jpg
    - assets/photos/ekotaban_optimized/6bd6868d93af4cf609d5.jpg
    - assets/photos/ekotaban_optimized/2de1507c506dcbc463ec.jpg
    - assets/photos/ekotaban_optimized/191144a986a7537f8510.jpg
    - assets/maps/turkiye_provinces_paintmaps.png
    - assets/maps/turkiye_il_haritasi.svg
    - assets/data/marmara_place_enrichment.json
    - assets/data/akdeniz_research_places.json
    - assets/data/turkiye_research_places.json
    - assets/data/research_photos.json
    - assets/data/research_photo_places.json
    - assets/data/ekotaban_photo_assets.json
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Variable.ttf
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Variable.ttf
